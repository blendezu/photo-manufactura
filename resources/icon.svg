<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" version="1.1" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="80" fill="url(#grad1)"/>
  
  <!-- Camera body -->
  <rect x="96" y="180" width="320" height="220" rx="20" fill="#ffffff" opacity="0.95"/>
  
  <!-- Lens -->
  <circle cx="256" cy="290" r="80" fill="#357ABD" opacity="0.8"/>
  <circle cx="256" cy="290" r="60" fill="#4A90E2"/>
  <circle cx="256" cy="290" r="30" fill="#2C3E50" opacity="0.7"/>
  
  <!-- Flash -->
