  <!-- Film strip decoration -->
  <rect x="96" y="420" width="320" height="40" rx="5" fill="#2C3E50" opacity="0.3"/>
  <rect x="110" y="430" width="20" height="20" fill="#ffffff" opacity="0.5"/>
  <rect x="150" y="430" width="20" height="20" fill="#ffffff" opacity="0.5"/>
  <rect x="190" y="430" width="20" height="20" fill="#ffffff" opacity="0.5"/>
  <rect x="342" y="430" width="20" height="20" fill="#ffffff" opacity="0.5"/>
  <rect x="382" y="430" width="20" height="20" fill="#ffffff" opacity="0.5"/>
