name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-release-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-
      
      - name: Install dependencies
        run: |
          brew install qt@6 opencv libraw ninja cmake librsvg create-dmg
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH
      
      - name: Generate icon
        run: |
          cd resources
          chmod +x generate_icon.sh
          ./generate_icon.sh
          cd ..
      
      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: |
          cmake --build build --config Release
      
      - name: Bundle Qt frameworks
        run: |
          macdeployqt build/bin/photo_manufactura.app -always-overwrite
      
      - name: Create DMG
        run: |
          chmod +x scripts/create_macos_dmg.sh
          ./scripts/create_macos_dmg.sh
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photo_Manufactura_macOS
          path: Photo_Manufactura_v*_macOS.dmg
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: Photo_Manufactura_v*_macOS.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  build-linux:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-release-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools \
            libqt6opengl6-dev libqt6openglwidgets6 \
            libopencv-dev \
            libraw-dev \
            file wget
      
      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
      
      - name: Build
        run: |
          cmake --build build --config Release
      
      - name: Create AppImage
        run: |
          chmod +x scripts/create_linux_appimage.sh
          ./scripts/create_linux_appimage.sh || echo "AppImage creation skipped"
      
      - name: Create tarball (fallback)
        run: |
          cd build
          VERSION=$(cat ../VERSION | tr -d '[:space:]')
          tar -czf ../Photo_Manufactura_v${VERSION}_Linux.tar.gz bin/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photo_Manufactura_Linux
          path: |
            Photo_Manufactura*.AppImage
            Photo_Manufactura*.tar.gz
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Photo_Manufactura*.AppImage
            Photo_Manufactura*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.3'
          arch: 'win64_msvc2019_64'
      
      - name: Install dependencies with vcpkg
        run: |
          vcpkg install opencv:x64-windows libraw:x64-windows
      
      - name: Configure CMake
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
      
      - name: Build
        run: |
          cmake --build build --config Release
      
      - name: Deploy Qt
        run: |
          windeployqt.exe build/bin/Release/photo_manufactura.exe
      
      - name: Create ZIP
        run: |
          $VERSION = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path build/bin/Release/* `
            -DestinationPath "Photo_Manufactura_v${VERSION}_Windows.zip"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photo_Manufactura_Windows
          path: Photo_Manufactura_v*_Windows.zip
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: Photo_Manufactura_v*_Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
